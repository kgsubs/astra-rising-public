# /etc/nginx/sites-available/astrarising.com.conf
# Fronts the Astra Rising Node server (127.0.0.1:3500) for astrarising.com.
#
# Provisioning: deploy HTTP-only first, reload nginx, then run
#   sudo certbot --nginx -d astrarising.com -d www.astrarising.com --redirect
# certbot injects the `listen 443 ssl` stanza + cert paths into this server
# block and adds the :80 -> :443 redirect block. Renewal uses the box's
# existing certbot.timer.
#
# The app streams the AI's narration over SSE, so proxy buffering must stay
# off and the read timeout long: with buffering on, nginx holds the whole
# response and the player watches a blank screen until the turn finishes.

server {
    listen 80;
    listen [::]:80;
    server_name astrarising.com www.astrarising.com;

    # Long campaign saves are pushed as one JSON body.
    client_max_body_size 4m;

    location / {
        proxy_pass         http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        # Server-sent events: stream through untouched.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
