    // SECTION 27a -- SAVE DATA VALIDATOR
    function validateSaveData(data) {
      const errors = [];
      if (!data || typeof data !== 'object') {
        errors.push('Invalid save data format');
        return { valid: false, errors };
      }
      if (!data.character || typeof data.character !== 'object') errors.push('Missing required field: character');
      else if (!data.character.name || typeof data.character.name !== 'string') errors.push('Character data is incomplete');
      if (!data.campaign || typeof data.campaign !== 'object') errors.push('Missing required field: campaign');
      else if (!data.campaign.adventure_id) errors.push('Campaign data is incomplete');
      if (!data.session || typeof data.session !== 'object') errors.push('Missing required field: session');
      if (!data.scene || typeof data.scene !== 'object') errors.push('Missing required field: scene');
      if (!data.meta || typeof data.meta !== 'object') errors.push('Missing required field: meta');
      else if (data.meta.initialized !== true) errors.push('Save data not fully initialized (meta.initialized is false)');
      return { valid: errors.length === 0, errors };
    }

    // SECTION 27b -- PARSE AND LOAD SAVE
    function parseAndLoadSave(jsonString, setGameState, setPhase) {
      let parsed;
      try {
        parsed = JSON.parse(jsonString);
      } catch (e) {
        return { success: false, errors: ['Invalid JSON: ' + e.message] };
      }
      const validation = validateSaveData(parsed);
      if (!validation.valid) {
        return { success: false, errors: validation.errors };
      }
      // API key is NOT in gameState by design -- player must re-enter it
      // Ensure meta.dev_mode is preserved
      const safeState = { ...parsed, meta: { ...parsed.meta, dev_mode: true } };
      setGameState(safeState);
      setPhase('GAME');
      return { success: true, errors: [] };
    }

    // SECTION 27c -- CONTINUE CAMPAIGN PANEL
    function ContinueCampaignPanel({ onLoad, onCancel }) {
      const [jsonText, setJsonText] = useState('');
      const [errors, setErrors] = useState([]);
      const [loading, setLoading] = useState(false);

      const handleLoad = () => {
        if (!jsonText.trim()) {
          setErrors(['Please paste your saved campaign JSON.']);
          return;
        }
        setLoading(true);
        const result = onLoad(jsonText);
        setLoading(false);
        if (!result.success) {
          setErrors(result.errors);
        }
      };

      return (
        <div className="bg-gray-800 border border-gray-700 rounded-lg p-4">
          <div className="font-bold text-gray-100 mb-1 text-sm">Continue Campaign</div>
          <p className="text-gray-400 text-xs mb-3">
            Paste your saved campaign JSON below. Your API key is not included in saves — enter it above before loading.
          </p>
          <textarea
            value={jsonText}
            onChange={e => { setJsonText(e.target.value); setErrors([]); }}
            placeholder='Paste your exported campaign JSON here...'
            className="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-gray-300 text-xs font-mono h-32 resize-y focus:outline-none focus:border-yellow-500 mb-3"
          />
          {errors.length > 0 && (
            <div className="mb-3">
              {errors.map((err, i) => (
                <div key={i} className="flex items-center gap-1 text-xs text-red-400 mb-0.5">
                  <AlertCircle size={10} />
                  <span>{err}</span>
                </div>
              ))}
            </div>
          )}
          <div className="flex gap-2">
            <button
              onClick={handleLoad}
              disabled={loading}
              className="flex-1 bg-yellow-400 text-gray-900 font-bold py-2 px-4 rounded hover:bg-yellow-300 text-sm disabled:opacity-50"
            >
              {loading ? 'Loading...' : 'Load Campaign'}
            </button>
            <button
              onClick={onCancel}
              className="bg-gray-700 text-gray-300 py-2 px-4 rounded hover:bg-gray-600 text-sm"
            >
              Cancel
            </button>
          </div>
        </div>
      );

    // SECTION 18 -- STATE MANAGER

    function clampStamina(current, delta, max) {
      return Math.max(0, Math.min(max, current + delta));
    }

    function applySeuDelta(seu, delta, seu_source) {
      if (!delta || delta === 0) return seu;
      let remaining = Math.abs(delta);
      const newSources = seu.sources.map(src => ({ ...src }));

      // Try named source first
      if (seu_source) {
        const namedIdx = newSources.findIndex(s => s.name === seu_source);
        if (namedIdx >= 0) {
          const deduct = Math.min(remaining, newSources[namedIdx].seu);
          newSources[namedIdx].seu -= deduct;
          remaining -= deduct;
        }
      }

      // Fall back to other sources in order
      if (remaining > 0) {
        for (let i = 0; i < newSources.length; i++) {
          if (newSources[i].seu > 0) {
            const deduct = Math.min(remaining, newSources[i].seu);
            newSources[i].seu = Math.max(0, newSources[i].seu - deduct);
            remaining -= deduct;
            if (remaining <= 0) break;
          }
        }
      }

      const newTotal = newSources.reduce((sum, s) => sum + s.seu, 0);
      return { total: Math.max(0, newTotal), sources: newSources };
    }

    function applyNpcUpdates(campaign, npc_updates) {
      if (!npc_updates || npc_updates.length === 0) return campaign;
      const newNpcs = [...(campaign.npcs || [])];
      npc_updates.forEach(update => {
        const idx = newNpcs.findIndex(n => n.name === update.name);
        if (idx >= 0) {
          newNpcs[idx] = { ...newNpcs[idx], ...update };
        } else {
          newNpcs.push({ name: update.name || 'Unknown', role: update.role || '', goal: update.goal || '', attitude: update.attitude || 'neutral', condition: update.condition || 'healthy' });
        }
      });
      return { ...campaign, npcs: newNpcs };
    }

    function applyFactionUpdates(campaign, faction_updates) {
      if (!faction_updates || faction_updates.length === 0) return campaign;
      const newFactions = [...(campaign.factions || [])];
      faction_updates.forEach(update => {
        const idx = newFactions.findIndex(f => f.name === update.name);
        if (idx >= 0) {
          const newStanding = (newFactions[idx].standing || 0) + (update.standing_delta || 0);
          const newNotes = update.note ? [...(newFactions[idx].notes || []), update.note] : (newFactions[idx].notes || []);
          newFactions[idx] = { ...newFactions[idx], standing: newStanding, notes: newNotes };
        } else {
          newFactions.push({ name: update.name, standing: update.standing_delta || 0, notes: update.note ? [update.note] : [] });
        }
      });
      return { ...campaign, factions: newFactions };
    }

    function applyJournalEntry(campaign, entry) {
      if (!entry || typeof entry !== 'string' || !entry.trim()) return campaign;
      const newEntry = { timestamp: Date.now(), entry: entry.trim() };
      return { ...campaign, journal: [...(campaign.journal || []), newEntry] };
    }

    function applyStateUpdates(gameState, stateUpdates) {
      if (!stateUpdates || !gameState.character) return gameState;

      const su = stateUpdates;
      let char = { ...gameState.character };
      let campaign = { ...gameState.campaign };

      // 1. Stamina delta
      if (su.stamina_delta !== undefined && su.stamina_delta !== null && su.stamina_delta !== 0) {
        char = { ...char, stamina: { ...char.stamina, current: clampStamina(char.stamina.current, su.stamina_delta, char.stamina.max) } };
      }

      // 2. SEU delta
      if (su.seu_delta !== undefined && su.seu_delta !== null && su.seu_delta !== 0) {
        char = { ...char, seu: applySeuDelta(char.seu, su.seu_delta, su.seu_source || null) };
      }

      // 3. Ammo updates
      if (su.ammo_updates && typeof su.ammo_updates === 'object') {
        const newAmmo = { ...char.ammo };
        Object.entries(su.ammo_updates).forEach(([key, delta]) => {
          newAmmo[key] = Math.max(0, (newAmmo[key] || 0) + delta);
        });
        char = { ...char, ammo: newAmmo };
      }

      // 4. Status add
      if (Array.isArray(su.status_add)) {
        const newStatuses = [...char.status_effects];
        su.status_add.forEach(s => { if (s && !newStatuses.includes(s)) newStatuses.push(s); });
        char = { ...char, status_effects: newStatuses };
      }

      // 5. Status remove
      if (Array.isArray(su.status_remove)) {
        char = { ...char, status_effects: char.status_effects.filter(s => !su.status_remove.includes(s)) };
      }

      // 6. Inventory add
      if (Array.isArray(su.inventory_add)) {
        const newInv = [...char.inventory];
        su.inventory_add.forEach(item => { if (item && typeof item === 'string' && item.trim()) newInv.push(item.trim()); });
        char = { ...char, inventory: newInv };
      }

      // 7. Inventory remove
      if (Array.isArray(su.inventory_remove)) {
        char = { ...char, inventory: char.inventory.filter(item => !su.inventory_remove.includes(item)) };
      }

      // 8. XP delta
      if (su.xp_delta !== undefined && su.xp_delta !== null && su.xp_delta !== 0) {
        char = { ...char, xp: { total: char.xp.total + su.xp_delta, unspent: char.xp.unspent + su.xp_delta } };
      }

      // 9. Credits delta
      if (su.credits_delta !== undefined && su.credits_delta !== null && su.credits_delta !== 0) {
        char = { ...char, credits: Math.max(0, char.credits + su.credits_delta) };
      }

      // 10. NPC updates
      if (su.npc_updates) {
        campaign = applyNpcUpdates(campaign, su.npc_updates);
      }

      // 11. Faction updates
      if (su.faction_updates) {
        campaign = applyFactionUpdates(campaign, su.faction_updates);
      }

      // 12. Journal entry
      if (su.journal_entry) {
        campaign = applyJournalEntry(campaign, su.journal_entry);
      }

      // 13. Scene transition
      if (su.scene_id && typeof su.scene_id === 'string' && su.scene_id.trim()) {
        campaign = { ...campaign, current_scene_id: su.scene_id.trim() };
      }

      return { ...gameState, character: char, campaign };
    }

    // SECTION 22 -- COMBAT ENGINE

    // Combat constants
    const COMBAT_PHASES = {
      INITIATIVE: 'initiative',
      PLAYER_TURN: 'player_turn',
      ENEMY_TURN: 'enemy_turn',
      END: 'end'
    };

    const OPTIONAL_RULES_DEFAULT = {
      burst_fire: false,
      called_shots: false,
      cover_concealment: false,
      suppression_fire: false
    };

    // Range modifiers (Astra Rising Core)
    const RANGE_MODIFIERS = {
      POINT_BLANK: 20,
      SHORT: 10,
      MEDIUM: 0,
      LONG: -10,
      EXTREME: -20
    };

    // Core dice function
    function rollD100() {
      return Math.floor(Math.random() * 100) + 1;
    }

    // Astra Rising Core attack resolution
    // skillLevel: the character's skill level (e.g. Beam Weapons 2)
    // modifiers: array of integers (range modifiers, cover, etc.)
    // Returns { roll, target, success, margin }
    function resolveAttack(skillLevel, modifiers) {
      const baseTarget = skillLevel * 10;
      const totalMod = Array.isArray(modifiers) ? modifiers.reduce((a, b) => a + b, 0) : 0;
      const target = baseTarget + totalMod;
      const roll = rollD100();
      return {
        roll,
        target,
        success: roll <= target,
        margin: target - roll
      };
    }

    // Astra Rising Core initiative: lower value = acts first
    // Formula: (10 - IM) + d10 roll, lower is faster
    function rollInitiative(im, rs) {
      const d10 = Math.floor(Math.random() * 10) + 1;
      return (10 - im) + d10;
    }

    // Apply a DMResponse combat_state_update to the scene
    function applyCombatStateUpdate(scene, combatStateUpdate) {
      if (!combatStateUpdate) return scene;

      // Combat ends if combatants is null or empty array
      const combatants = combatStateUpdate.combatants;
      const combatEnded = !combatants || (Array.isArray(combatants) && combatants.length === 0);

      if (combatEnded) {
        return { ...scene, in_combat: false, combat_state: null };
      }

      return {
        ...scene,
        in_combat: true,
        combat_state: {
          round: combatStateUpdate.round || 1,
          phase: combatStateUpdate.phase || COMBAT_PHASES.INITIATIVE,
          initiative_order: combatStateUpdate.initiative_order || [],
          combatants: combatants,
          active_optional_rules: combatStateUpdate.active_optional_rules || { ...OPTIONAL_RULES_DEFAULT }
        }
      };
    }

    // SECTION 13 -- useDMTurn HOOK
    function useDMTurn({ gameState, setGameState, sessionToken, onError, onOocNote }) {
      const [loading, setLoading] = useState(false);
      const [currentChoices, setCurrentChoices] = useState([]);
      const [messages, setMessages] = useState([]); // conversation history for API
      const [latestDiceRolls, setLatestDiceRolls] = useState([]);
      const [latestTooltipTerms, setLatestTooltipTerms] = useState([]);

      const submitTurn = useCallback(async (playerText) => {
        if (loading || !playerText.trim()) return;
        setLoading(true);

        // Add player message to display history
        const playerMsg = { id: Date.now() + '_p', role: 'player', content: playerText, timestamp: Date.now() };
        setMessages(prev => [...prev, playerMsg]);

        // Build API message history (role: user/assistant pairs)
        const apiMessages = messages.reduce((acc, msg) => {
          if (msg.role === 'player') acc.push({ role: 'user', content: msg.content });
          if (msg.role === 'dm') acc.push({ role: 'assistant', content: msg._raw || msg.content });
          return acc;
        }, []);
        apiMessages.push({ role: 'user', content: playerText });

        const systemPrompt = buildSystemPrompt(gameState);
        const result = await callDM(sessionToken, apiMessages, systemPrompt, onError);

        if (!result) {
          setLoading(false);
          return;
        }

        const validation = validateDMResponse(result);
        if (!validation.valid) {
          onError({ code: 'VALIDATION_ERROR', message: 'DM response invalid: ' + validation.errors.join(', '), recoverable: true, retry_action: null });
          setLoading(false);
          return;
        }

        setLatestDiceRolls(result.dice_rolls || []);

        if (result.tooltip_terms && result.tooltip_terms.length > 0) {
          setLatestTooltipTerms(result.tooltip_terms);
        }

        if (result.ooc_note && onOocNote) onOocNote(result.ooc_note);

        // Add DM message to display history
        const dmMsg = {
          id: Date.now() + '_dm',
          role: 'dm',
          content: result.narrative,
          _raw: JSON.stringify(result),
          timestamp: Date.now()
        };
        setMessages(prev => [...prev, dmMsg]);
        setCurrentChoices(result.choices || []);

        // Apply state updates, scene changes, and turn count atomically
        setGameState(prev => {
          const withUpdates = applyStateUpdates(prev, result.state_updates);
          let withScene = { ...withUpdates, session: { ...withUpdates.session, turn_count: withUpdates.session.turn_count + 1 } };
          if (result.scene_change) {
            withScene = {
              ...withScene,
              scene: {
                ...withScene.scene,
                header: result.scene_header || withScene.scene.header,
                summary: result.scene_summary || withScene.scene.summary,
                recent_summaries: result.scene_summary
                  ? [...withScene.scene.recent_summaries, result.scene_summary]
                  : withScene.scene.recent_summaries
              },
              session: { ...withScene.session, scene_count: withScene.session.scene_count + 1 }
            };
          } else if (result.scene_summary) {
            withScene = { ...withScene, scene: { ...withScene.scene, summary: result.scene_summary } };
          }
          // Apply combat state update if present
          if (result.combat_state_update !== undefined) {
            const updatedScene = applyCombatStateUpdate(withScene.scene, result.combat_state_update);
            withScene = { ...withScene, scene: updatedScene };
          }
          return withScene;
        });

        setLoading(false);
      }, [loading, messages, gameState, sessionToken, onError]);

      const addDMMessage = useCallback((content, raw) => {
        const dmMsg = { id: Date.now() + '_dm', role: 'dm', content, _raw: raw || content, timestamp: Date.now() };
        setMessages(prev => [...prev, dmMsg]);
      }, []);

      return { submitTurn, loading, currentChoices, messages, addDMMessage, setCurrentChoices, latestDiceRolls, latestTooltipTerms };
    }

    // SECTION 28b -- TOOLTIP COMPONENT
    function Tooltip({ term, definition, children }) {
      const [visible, setVisible] = useState(false);
      return (
        <span

    // SECTION 28c -- WRAP TEXT WITH TOOLTIPS
    function wrapTextWithTooltips(text, registry) {
      if (!text || !registry || Object.keys(registry).length === 0) {
        return [<span key="raw">{text}</span>];
      }

      // Sort terms by length descending to match longer terms first
      const terms = Object.keys(registry).sort((a, b) => b.length - a.length);
      const usedTerms = new Set(); // first occurrence only per call

      // Build a regex that matches any term (case-insensitive)
      const escapedTerms = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      if (escapedTerms.length === 0) return [<span key="raw">{text}</span>];
      const pattern = new RegExp(`(${escapedTerms.join('|')})`, 'gi');

      const parts = text.split(pattern);
      const elements = [];

      parts.forEach((part, i) => {
        if (!part) return;
        const lowerPart = part.toLowerCase();
        const def = registry[lowerPart];
        if (def && !usedTerms.has(lowerPart)) {
          usedTerms.add(lowerPart);
          elements.push(
            <Tooltip key={i} term={part} definition={def}>
              {part}
            </Tooltip>
          );
        } else {
          elements.push(<span key={i}>{part}</span>);
        }
      });

      return elements;
    }

        <div className="px-4 py-3 bg-gray-800 border-t border-gray-700 flex gap-2">

    function MetaControlsBar({ gameState, setGameState, onAskDm, onRestoreSnapshot, onOpenJournal, onEndSession, sessionToken, onToast }) {
      const [showSnapshots, setShowSnapshots] = useState(false);
      const [confirmRestore, setConfirmRestore] = useState(null);
      const inCombat = gameState.scene.in_combat;
      const snapshots = gameState.meta.snapshots || [];

      const formatTime = (ts) => {
        const d = new Date(ts);
        return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
      };

      const handleSaveSnapshot = () => {
        const snap = createSnapshot(gameState);
        setGameState(prev => ({
          ...prev,
          meta: {
            ...prev.meta,
            snapshots: [...prev.meta.snapshots, snap].slice(-5)
          }
        }));
        onRestoreSnapshot('SAVED'); // signal toast
      };

      const handleConfirmRestore = () => {
        if (!confirmRestore) return;
        const restored = restoreSnapshot(confirmRestore);
        setGameState(restored);
        setConfirmRestore(null);
        setShowSnapshots(false);
      };

      return (
        <div className="relative flex items-center gap-2 px-3 py-1.5 bg-gray-800 border-b border-gray-700 flex-shrink-0">

            disabled={inCombat}

              inCombat
                ? 'border-gray-700 text-gray-600 cursor-not-allowed'
                : 'border-gray-600 text-gray-300 hover:border-yellow-500 hover:text-yellow-300 cursor-pointer'
            }`}
          >
            <RefreshCw size={10} />
            <span>Save Checkpoint</span>

    // SECTION 6 -- BUILD SYSTEM PROMPT

        layer3 += `STATS(str/sta/dex/rs/int/log/per/ldr): ${statStr}\n`;

      // JSON response schema reference

    // SECTION 26a -- COMPRESSED SYSTEM PROMPT BUILDER
    function buildCompressedSystemPrompt(gameState) {

            layer3 += `CURRENT_SCENE: ${modScene.title} [${modScene.type}]\n`;

            if (modScene.npcs_present && modScene.npcs_present.length > 0) {

            if (modScene.exits && modScene.exits.length > 0) {

    // SECTION 26b -- COMPRESS CAMPAIGN HISTORY
    async function compressCampaignHistory(gameState, sessionToken, onError, onSuccess) {
      const camp = gameState.campaign;
      const char = gameState.character;
      const scene = gameState.scene;

      // Build the data to compress
      const dataToCompress = {
        adventure: camp ? { title: camp.adventure_title, story_device: camp.story_device, spine: camp.spine } : null,
        character: char ? { name: char.name, race: char.race, archetype: char.archetype, stamina: char.stamina, status_effects: char.status_effects, skills: char.skills, credits: char.credits, xp: char.xp } : null,
        npcs: camp ? camp.npcs : [],
        factions: camp ? camp.factions : [],
        journal: camp ? camp.journal : [],
        recent_summaries: scene.recent_summaries || [],
        session: gameState.session
      };

      const compressionPrompt = `Summarize the following Astra Rising campaign history in 300-500 tokens, preserving: active NPCs and their attitudes, faction standings, current campaign spine status, most important events, current character equipment and health status. Campaign data:\n\n${JSON.stringify(dataToCompress, null, 2)}`;

      const compressionSystemMsg = 'You are a campaign historian. Your task is to compress campaign history into a concise summary preserving all game-mechanically relevant information. Do not use JSON. Write flowing prose. Maximum 500 tokens.';

      // Direct fetch for compression (plain text response, not DMResponse JSON)
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Session-Token': sessionToken,
            'anthropic-version': API_CONSTANTS.API_VERSION
          },
          body: JSON.stringify({
            model: API_CONSTANTS.MODEL,
            max_tokens: 600,
            system: compressionSystemMsg,
            messages: [{ role: 'user', content: compressionPrompt }]
          })
        });

        if (!response.ok) {
          onError({ code: `HTTP_${response.status}`, message: `Compression failed: ${response.statusText}`, recoverable: true, retry_action: null });
          return null;
        }

        const data = await response.json();
        const compressedText = data.content && data.content[0] && data.content[0].text;
        if (!compressedText) {
          onError({ code: 'JSON_PARSE_ERROR', message: 'Empty compression response', recoverable: true, retry_action: null });
          return null;
        }

        if (onSuccess) onSuccess(compressedText);
        return compressedText;
      } catch (err) {
        onError({ code: 'NETWORK_ERROR', message: 'Network error during compression', recoverable: true, retry_action: null });
        return null;
      }
    }

    // SECTION 7 -- RESPONSE VALIDATORS
    function validateDMResponse(obj) {
      const errors = [];
      if (!obj || typeof obj !== 'object') { errors.push('Response is not an object'); return { valid: false, errors }; }
      if (typeof obj.narrative !== 'string' || obj.narrative.length === 0) errors.push('narrative missing or empty');
      if (!Array.isArray(obj.choices)) errors.push('choices is not an array');
      if (!obj.state_updates || typeof obj.state_updates !== 'object') errors.push('state_updates missing');
      return { valid: errors.length === 0, errors };
    }

    function validateSessionZeroResponse(obj) {
      const errors = [];
      if (!obj || typeof obj !== 'object') { errors.push('Response is not an object'); return { valid: false, errors }; }
      if (typeof obj.story_device !== 'string' || obj.story_device.length === 0) errors.push('story_device missing');
      if (!Array.isArray(obj.hooks) || obj.hooks.length !== 3) errors.push('hooks must be array of length 3');
      if (!obj.campaign_spine || typeof obj.campaign_spine !== 'object') errors.push('campaign_spine missing');
      else {
        if (!obj.campaign_spine.act1_goal) errors.push('campaign_spine.act1_goal missing');
        if (!obj.campaign_spine.act2_complication) errors.push('campaign_spine.act2_complication missing');
        if (!obj.campaign_spine.act3_convergence) errors.push('campaign_spine.act3_convergence missing');
      }
      if (!Array.isArray(obj.key_npcs)) errors.push('key_npcs is not an array');
      return { valid: errors.length === 0, errors };
    }

    // SECTION 8 -- callDM FUNCTION
    async function callDM(sessionToken, messages, systemPrompt, onError) {
      const makeRequest = async () => {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Session-Token': sessionToken,
            'anthropic-version': API_CONSTANTS.API_VERSION
          },
          body: JSON.stringify({
            model: API_CONSTANTS.MODEL,
            max_tokens: API_CONSTANTS.MAX_TOKENS,
            system: systemPrompt,
            messages
          })
        });

        if (!response.ok) {
          const codeMap = { 401: 'HTTP_401', 429: 'HTTP_429', 500: 'HTTP_500' };
          const code = codeMap[response.status] || `HTTP_${response.status}`;
          const err = {
            code,
            message: `API error ${response.status}: ${response.statusText}`,
            recoverable: response.status !== 401,
            retry_action: response.status !== 401 ? (() => callDM(sessionToken, messages, systemPrompt, onError)) : null
          };
          onError(err);
          return null;
        }

        const data = await response.json();
        const text = data.content && data.content[0] && data.content[0].text;
        if (!text) {
          onError({ code: 'JSON_PARSE_ERROR', message: 'Empty response from API', recoverable: true, retry_action: () => callDM(sessionToken, messages, systemPrompt, onError) });
          return null;
        }

        try {
          return JSON.parse(text);
        } catch (e) {
          onError({ code: 'JSON_PARSE_ERROR', message: 'Could not parse DM response as JSON', recoverable: true, retry_action: () => callDM(sessionToken, messages, systemPrompt, onError) });
          return null;
        }
      };

      try {
        return await makeRequest();
      } catch (networkErr) {
        // Silent retry once on network error
        try {
          return await makeRequest();
        } catch (retryErr) {
          onError({ code: 'NETWORK_ERROR', message: 'Network error: could not reach Anthropic API', recoverable: true, retry_action: () => callDM(sessionToken, messages, systemPrompt, onError) });
          return null;
        }
      }
    }

    // SECTION 9 -- initializeSession FUNCTION
    function initializeSession(selectedChar, selectedAdventure, response, currentMeta) {
      return {
        character: {
          ...selectedChar,
          stamina: { current: selectedChar.stamina.max, max: selectedChar.stamina.max }
        },
        campaign: {
          adventure_id: selectedAdventure.id,
          adventure_title: selectedAdventure.title,
          story_device: response.story_device,
          story_device_seed: response.story_device_seed || '',
          spine: response.campaign_spine,
          npcs: response.key_npcs || [],
          factions: [],
          hooks: response.hooks,
          journal: [],
          current_scene_id: ADVENTURE_MODULES[selectedAdventure.id]?.scenes?.[0]?.id ?? null
        },
        meta: { ...currentMeta, initialized: true, loading: false }
      };
    }

    // SECTION 10 -- LOADING TIDBITS COMPONENT
    const LORE_TIDBITS = [
      'The Frontier spans seventeen inhabited star systems united under the Concordat of Free Worlds.',
      'The four major races -- Human, Krix, Moluun, and Skrath -- each bring unique biological advantages to field operations.',
      'The The Vaash are a serpentine race of unknown origin whose only known motivation is the destruction of all civilization.',
      'Apex Law is the CFW\'s elite law enforcement agency, operating in the shadows between political systems.',
      'Credits are the universal currency of the Frontier -- one credit buys a basic meal, one thousand buys a used skimmer.',
      'Stamina Points represent a character\'s ability to absorb punishment. When they reach zero, the character falls unconscious.',
      'The Korvath system, home of planet Cethara, sits on the frontier of explored space -- and beyond it lies the unknown.'
    ];

    function LoadingTidbits() {
      const [tidbitIdx, setTidbitIdx] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => {
          setTidbitIdx(i => (i + 1) % LORE_TIDBITS.length);
        }, 3000);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center px-6">
          <Loader size={40} className="text-yellow-400 animate-spin mb-6" />
          <div className="text-yellow-400 font-bold text-lg mb-4 uppercase tracking-widest">Preparing Your Mission</div>
          <div className="max-w-md text-center">
            <p className="text-gray-400 text-sm italic leading-relaxed transition-all duration-500">
              {LORE_TIDBITS[tidbitIdx]}
            </p>
          </div>
        </div>
      );
    }

    // SECTION 11 -- HOOK CARD COMPONENT
    function HookCard({ hook, index, onSelect }) {
      const labels = ['Hook Alpha', 'Hook Beta', 'Hook Gamma'];
      return (
        <div className="bg-gray-800 border border-gray-700 hover:border-yellow-400 rounded-xl p-6 flex flex-col cursor-pointer transition-colors flex-1"
             onClick={() => onSelect(index)}>
          <div className="text-xs font-bold text-yellow-400 uppercase tracking-widest mb-2">{labels[index]}</div>
          <h3 className="text-gray-100 font-bold text-base mb-3">{hook.title}</h3>
          <p className="text-gray-300 text-sm leading-relaxed flex-1 mb-4">{hook.opening}</p>
          <button className="w-full bg-yellow-400 text-gray-900 font-bold py-2 px-4 rounded hover:bg-yellow-300 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400 cursor-pointer">
            Begin with this hook
          </button>
        </div>
      );
    }

    // SECTION 12 -- SESSION ZERO SCREEN
    function SessionZeroScreen({ hooks, error, onHookSelect }) {
      const [szState, setSzState] = useState('HOOKS'); // HOOKS | TRANSITION
      const [selectedHookIdx, setSelectedHookIdx] = useState(null);

      const handleHookSelect = (idx) => {
        setSelectedHookIdx(idx);
        setSzState('TRANSITION');
        setTimeout(() => {
          onHookSelect(idx);
        }, 1500);
      };

      if (szState === 'TRANSITION') {
        return (
          <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center px-6">
            <Loader size={40} className="text-yellow-400 animate-spin mb-6" />
            <div className="text-yellow-400 font-bold text-lg uppercase tracking-widest">Preparing your adventure...</div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center px-6">
            <AlertCircle size={40} className="text-red-400 mb-4" />
            <div className="text-red-400 font-bold text-lg mb-2">Session Zero Failed</div>
            <p className="text-gray-400 text-sm text-center max-w-md">{error.message}</p>
            {error.recoverable && error.retry_action && (
              <button onClick={error.retry_action} className="mt-4 bg-yellow-400 text-gray-900 font-bold py-2 px-6 rounded hover:bg-yellow-300">
                Retry
              </button>
            )}
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-900 flex flex-col px-6 py-8">
          <div className="text-center mb-8">
            <h2 className="text-2xl font-extrabold text-yellow-400 tracking-wide mb-2">Choose Your Hook</h2>
            <p className="text-gray-400 text-sm">Select the opening that calls to you. Your choice shapes the adventure.</p>
          </div>
          <div className="flex flex-row gap-4 flex-1 max-w-5xl mx-auto w-full">
            {hooks.map((hook, idx) => (
              <HookCard key={idx} hook={hook} index={idx} onSelect={handleHookSelect} />
            ))}
          </div>
        </div>
      );
    }

    // SECTION 4 -- APP COMPONENT

    function App() {
      const [gameState, setGameState] = useState(INITIAL_STATE);
      const [sessionToken, setSessionToken] = useState(null);
      const [selectedCharId, setSelectedCharId] = useState(null);
      const [selectedAdventureId, setSelectedAdventureId] = useState(null);
      const [phase, setPhase] = useState('SETUP');
      const [sessionZeroData, setSessionZeroData] = useState(null);
      const [szError, setSzError] = useState(null);
      const [firstHookOpening, setFirstHookOpening] = useState(null);

      // Session init: restore existing session or create new one on mount
      useEffect(() => {
        const existingToken = localStorage.getItem('sf_session_token');
        if (existingToken) {
          fetch(`/api/session/${existingToken}`)
            .then(r => r.ok ? r.json() : null)
            .then(data => {
              if (data) {
                setSessionToken(existingToken);
              } else {
                // Token invalid or expired — create a fresh session
                return fetch('/api/session', { method: 'POST' })
                  .then(r => r.json())
                  .then(({ token }) => {
                    localStorage.setItem('sf_session_token', token);
                    setSessionToken(token);
                  });
              }
            })
            .catch(() => {
              // Network error — still set the existing token so gameplay can proceed
              setSessionToken(existingToken);
            });
        } else {
          fetch('/api/session', { method: 'POST' })
            .then(r => r.json())
            .then(({ token }) => {
              localStorage.setItem('sf_session_token', token);
              setSessionToken(token);
            })
            .catch(() => {});
        }
      }, []); // eslint-disable-line -- fire only on mount

      const handleBeginAdventure = useCallback(async () => {
        const selectedChar = CHARACTER_ROSTER.find(c => c.id === selectedCharId);
        const selectedAdventure = ADVENTURE_LIBRARY.find(a => a.id === selectedAdventureId);
        if (!selectedChar || !selectedAdventure) return;

        setGameState(prev => ({ ...prev, meta: { ...prev.meta, loading: true } }));
        setPhase('SESSION_ZERO');
        setSzError(null);

        const systemPrompt = buildSystemPrompt({
          ...INITIAL_STATE,
          character: selectedChar,
          campaign: { adventure_id: selectedAdventure.id, adventure_title: selectedAdventure.title }
        });

        const initUserMsg = `Begin Session Zero for the adventure "${selectedAdventure.title}". My character is ${selectedChar.name}, a ${selectedChar.race} ${selectedChar.archetype}. Generate a SessionZeroResponse JSON as specified in the schema. The story device should fit the adventure's genre (${selectedAdventure.genre}) and tone (${selectedAdventure.tone.join(', ')}). Create 3 distinct hooks that each offer a different way into the story.`;

        const result = await callDM(sessionToken, [{ role: 'user', content: initUserMsg }], systemPrompt, (err) => {
          setSzError(err);
          setGameState(prev => ({ ...prev, meta: { ...prev.meta, loading: false } }));
        });

        if (!result) return; // error already handled

        const validation = validateSessionZeroResponse(result);
        if (!validation.valid) {
          setSzError({ code: 'VALIDATION_ERROR', message: 'DM response missing required fields: ' + validation.errors.join(', '), recoverable: true, retry_action: handleBeginAdventure });
          setGameState(prev => ({ ...prev, meta: { ...prev.meta, loading: false } }));
          return;
        }

        const selectedChar2 = CHARACTER_ROSTER.find(c => c.id === selectedCharId);
        const selectedAdventure2 = ADVENTURE_LIBRARY.find(a => a.id === selectedAdventureId);
        const initData = initializeSession(selectedChar2, selectedAdventure2, result, gameState.meta);
        setGameState(prev => ({ ...prev, ...initData }));
        setSessionZeroData(result);
      }, [sessionToken, selectedCharId, selectedAdventureId, gameState.meta]);

      const handleHookSelect = useCallback((hookIdx) => {
        if (sessionZeroData && sessionZeroData.hooks[hookIdx]) {
          setFirstHookOpening(sessionZeroData.hooks[hookIdx].opening);
        }
        setPhase('GAME');
      }, [sessionZeroData]);

      const handleNewAdventure = useCallback(() => {
        setGameState(INITIAL_STATE);
        setPhase('SETUP');
        setSelectedCharId(null);
        setSelectedAdventureId(null);
        setSessionZeroData(null);
        setSzError(null);
        setFirstHookOpening(null);
      }, []);

      const handleLoadSave = useCallback((jsonString) => {
        return parseAndLoadSave(jsonString, setGameState, setPhase);
      }, [setPhase]);

      const p1_1_assertions = [
        { label: 'INITIAL_STATE.character is null', pass: INITIAL_STATE.character === null },
        { label: 'INITIAL_STATE.campaign is null', pass: INITIAL_STATE.campaign === null },
        { label: 'meta.dev_mode is true', pass: INITIAL_STATE.meta.dev_mode === true },
        { label: 'session.number is 1', pass: INITIAL_STATE.session.number === 1 },
        { label: 'meta.initialized is false', pass: INITIAL_STATE.meta.initialized === false }
      ];

      const p1_2_assertions = [
        { label: 'CHARACTER_ROSTER has 4 entries', pass: CHARACTER_ROSTER.length === 4 },
        { label: 'All characters have stamina.max > 0', pass: CHARACTER_ROSTER.every(c => c.stamina.max > 0) },
        { label: 'Rayla difficulty is experienced', pass: CHARACTER_ROSTER.find(c => c.id === 'rayla').ui_meta.difficulty === 'experienced' },
        { label: 'All characters have skills array', pass: CHARACTER_ROSTER.every(c => Array.isArray(c.skills)) }
      ];

      const p1_3_assertions = [
        { label: 'ADVENTURE_LIBRARY has 10 entries', pass: ADVENTURE_LIBRARY.length === 10 },
        { label: 'All adventures have id and title', pass: ADVENTURE_LIBRARY.every(a => a.id && a.title) },
        { label: 'Difficulties span Beginner to Advanced', pass: ADVENTURE_LIBRARY.some(a => a.difficulty === 'Beginner') && ADVENTURE_LIBRARY.some(a => a.difficulty === 'Advanced') }
      ];
      const p2_1_assertions = [
        { label: 'callDM is a function', pass: typeof callDM === 'function' },
        { label: 'validateDMResponse is a function', pass: typeof validateDMResponse === 'function' },
        { label: 'validateSessionZeroResponse is a function', pass: typeof validateSessionZeroResponse === 'function' },
        { label: 'buildSystemPrompt is a function', pass: typeof buildSystemPrompt === 'function' }
      ];
      const p2_2_assertions = [
        { label: 'initializeSession is a function', pass: typeof initializeSession === 'function' },
        { label: 'LORE_TIDBITS has 7 items', pass: LORE_TIDBITS.length === 7 },
        { label: 'phase state is SETUP initially', pass: phase === 'SETUP' }
      ];
      const p3_1_assertions = [
        { label: 'useDMTurn submitTurn is a function', pass: typeof useDMTurn === 'function' },
        { label: 'MessageHistory component defined', pass: typeof MessageHistory === 'function' },
        { label: 'ChoiceMenu component defined', pass: typeof ChoiceMenu === 'function' },
        { label: 'session.turn_count starts at 0', pass: INITIAL_STATE.session.turn_count === 0 }
      ];
      const p3_2_assertions = [
        { label: 'applyStateUpdates is a function', pass: typeof applyStateUpdates === 'function' },
        { label: 'clampStamina(50,-60,55) === 0', pass: clampStamina(50, -60, 55) === 0 },
        { label: 'clampStamina(50,10,55) === 55', pass: clampStamina(50, 10, 55) === 55 },
        { label: 'applyStateUpdates immutable (returns new obj)', pass: (() => { const s = { ...INITIAL_STATE, character: { stamina: { current: 50, max: 55 }, seu: { total: 0, sources: [] }, status_effects: [], inventory: [], ammo: {}, xp: { total: 0, unspent: 0 }, credits: 0, skills: [] } }; const r = applyStateUpdates(s, { stamina_delta: -5 }); return r !== s && r.character !== s.character; })() }
      ];
      const p3_3_assertions = [
        { label: 'CharacterSheet component defined', pass: typeof CharacterSheet === 'function' },
        { label: 'StaminaBar is a function', pass: typeof StaminaBar === 'function' },
        { label: 'SkillBadge is a function', pass: typeof SkillBadge === 'function' }
      ];
      const p4_1_assertions = [
        { label: 'rollD100 returns int in [1,100]', pass: (() => { const r = rollD100(); return Number.isInteger(r) && r >= 1 && r <= 100; })() },
        { label: 'resolveAttack is a function', pass: typeof resolveAttack === 'function' },
        { label: 'COMBAT_PHASES has 4 keys', pass: Object.keys(COMBAT_PHASES).length === 4 },
        { label: 'applyCombatStateUpdate is a function', pass: typeof applyCombatStateUpdate === 'function' }
      ];
      const p4_2_assertions = [
        { label: 'CombatPanel is a function', pass: typeof CombatPanel === 'function' },
        { label: 'DiceRollDisplay is a function', pass: typeof DiceRollDisplay === 'function' },
        { label: 'InitiativeTracker is a function', pass: typeof InitiativeTracker === 'function' }
      ];
      const p5_1_assertions = [
        { label: 'createSnapshot is a function', pass: typeof createSnapshot === 'function' },
        { label: 'restoreSnapshot is a function', pass: typeof restoreSnapshot === 'function' },
        { label: 'meta.snapshots is an array', pass: Array.isArray(INITIAL_STATE.meta.snapshots) },
        { label: 'MetaControlsBar is a function', pass: typeof MetaControlsBar === 'function' }
      ];
      const p5_2_assertions = [
        { label: 'JournalPanel is a function', pass: typeof JournalPanel === 'function' },
        { label: 'SummaryCard is a function', pass: typeof SummaryCard === 'function' },
        { label: 'EndSessionButton is a function', pass: typeof EndSessionButton === 'function' }
      ];
      const p6_1_assertions = [
        { label: 'compressCampaignHistory is a function', pass: typeof compressCampaignHistory === 'function' },
        { label: 'buildCompressedSystemPrompt is a function', pass: typeof buildCompressedSystemPrompt === 'function' },
        { label: 'scene.compressed_summary initialized to null', pass: INITIAL_STATE.scene.compressed_summary === null }
      ];
      const p6_2_assertions = [
        { label: 'parseAndLoadSave is a function', pass: typeof parseAndLoadSave === 'function' },
        { label: 'validateSaveData is a function', pass: typeof validateSaveData === 'function' },
        { label: 'ContinueCampaignPanel is a function', pass: typeof ContinueCampaignPanel === 'function' }
      ];
      const p7_1_assertions = [
        { label: 'TOOLTIP_GLOSSARY has >= 20 entries', pass: Object.keys(TOOLTIP_GLOSSARY).length >= 20 },
        { label: 'wrapTextWithTooltips is a function', pass: typeof wrapTextWithTooltips === 'function' },
        { label: 'Tooltip is a function', pass: typeof Tooltip === 'function' }
      ];
      const p7_2_assertions = [
        { label: 'SceneHeader is a function', pass: typeof SceneHeader === 'function' },
        { label: 'ContextBar is a function', pass: typeof ContextBar === 'function' },
        { label: 'MAP_DATA has 5 entries', pass: Object.keys(MAP_DATA).length === 5 }
      ];
      const allAssertions = [...p1_1_assertions, ...p1_2_assertions, ...p1_3_assertions, ...p2_1_assertions, ...p2_2_assertions, ...p3_1_assertions, ...p3_2_assertions, ...p3_3_assertions, ...p4_1_assertions, ...p4_2_assertions, ...p5_1_assertions, ...p5_2_assertions, ...p6_1_assertions, ...p6_2_assertions, ...p7_1_assertions, ...p7_2_assertions];

      return (
        <div>
          {phase === 'SETUP' && (
            <SetupScreen
              selectedCharId={selectedCharId}
              onCharSelect={setSelectedCharId}
              selectedAdventureId={selectedAdventureId}
              onAdventureSelect={setSelectedAdventureId}
              onBeginAdventure={handleBeginAdventure}
              onLoadSave={handleLoadSave}
            />
          )}
          {phase === 'SESSION_ZERO' && gameState.meta.loading && <LoadingTidbits />}
          {phase === 'SESSION_ZERO' && !gameState.meta.loading && sessionZeroData && (
            <SessionZeroScreen
              hooks={sessionZeroData.hooks}
              error={szError}
              onHookSelect={handleHookSelect}
            />
          )}
          {phase === 'SESSION_ZERO' && !gameState.meta.loading && szError && !sessionZeroData && (
            <SessionZeroScreen hooks={[]} error={szError} onHookSelect={handleHookSelect} />
          )}
          {phase === 'GAME' && (
            <GameScreen
              gameState={gameState}
              setGameState={setGameState}
              sessionToken={sessionToken}
              firstHookOpening={firstHookOpening}
              onNewAdventure={handleNewAdventure}
            />
          )}
          {gameState.meta.dev_mode && <AssertionPanel assertions={allAssertions} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
